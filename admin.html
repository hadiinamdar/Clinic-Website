<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14305a">
<title>Staff dashboard | Care Scan &amp; Diagnostic Centre</title>
<link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#0b1f33;--mute:#51667a;--navy:#14305a;--teal:#0f9d9a;--teal2:#d9f2f1;--red:#c8283c;--line:#d9e5ec;--sh:0 18px 44px -26px rgba(12,50,80,.35);
--ok:#0b7a43;--okbg:#dcf5e7;--warn:#8a5a00;--warnbg:#fff1cf;--bad:#9b1c2c;--badbg:#fde7ea;--info:#14305a;--infobg:#e4edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07131e;--card:#0f2132;--ink:#e8f1f7;--mute:#9db3c4;--navy:#7fb2ff;--teal:#35c9c4;--teal2:#0f3a40;--line:#1f3649;--sh:0 18px 44px -26px #000;
--ok:#6ee7a0;--okbg:#0e3322;--warn:#fbd36b;--warnbg:#3a2c08;--bad:#ff9aa6;--badbg:#431520;--info:#9cc2ff;--infobg:#12294a}}
:root[data-theme=dark]{--bg:#07131e;--card:#0f2132;--ink:#e8f1f7;--mute:#9db3c4;--navy:#7fb2ff;--teal:#35c9c4;--teal2:#0f3a40;--line:#1f3649;--sh:0 18px 44px -26px #000;--ok:#6ee7a0;--okbg:#0e3322;--warn:#fbd36b;--warnbg:#3a2c08;--bad:#ff9aa6;--badbg:#431520;--info:#9cc2ff;--infobg:#12294a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Figtree,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.lg-e{width:40px;height:40px;display:block;flex:none}.lg-w{height:30px;width:auto;display:block}
:root[data-theme=dark] .lg-w{filter:brightness(0) invert(1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-w{filter:brightness(0) invert(1)}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--navy);background:none;color:var(--navy);font:700 14px Figtree;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:linear-gradient(135deg,#35c9c4,#0f9d9a);border-color:transparent;color:#042a2a}
.btn.sm{padding:5px 11px;font-size:13px}.btn.danger{border-color:var(--bad);color:var(--bad)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:15px Figtree}
label{display:block;font-weight:500;font-size:13px;margin-bottom:4px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login .card{width:min(400px,100%)}
#login .brand{margin-bottom:22px}
.err{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--badbg);color:var(--bad);font-size:14px}
/* app */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.top h1{font-size:1.05rem;color:var(--mute);font-family:Figtree;font-weight:500;margin-left:6px}
main{padding:24px 0 80px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px 18px}.stat b{display:block;font:700 2rem Fraunces,serif;color:var(--navy);line-height:1.1}.stat span{font-size:13px;color:var(--mute)}
.banner{margin-bottom:12px;padding:12px 16px;border-radius:14px;font-size:14px;background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--infobg);color:var(--info)}
.tabs{display:flex;gap:6px;margin:6px 0 14px}
.tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Figtree;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:12px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .full{grid-column:1/-1}}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.meta{margin-left:auto;font-size:13px;color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:860px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;background:var(--bg)}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mute);font-size:12.5px}
td a{color:var(--navy)}
.when b{display:block;white-space:nowrap}
.reason{max-width:240px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.s-pending{background:var(--warnbg);color:var(--warn)}.s-confirmed{background:var(--okbg);color:var(--ok)}
.s-cancelled{background:var(--badbg);color:var(--bad)}.s-completed{background:var(--infobg);color:var(--info)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.today td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
#toast.bad{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<section id="login" hidden>
  <form class="card" id="lf" autocomplete="on">
    <a class="brand" href="./"><img class="lg-e" src="assets/logo-emblem.png" alt="" width="40" height="40"><img class="lg-w" src="assets/logo-wordmark.png" alt="Care Scan &amp; Diagnostic Centre" height="30"></a>
    <h2 style="font-size:1.5rem;margin-bottom:6px">Staff sign in</h2>
    <p style="color:var(--mute);margin:0 0 16px">Manage appointment requests and subscribers.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert" hidden></div>
    <p style="margin:16px 0 0"><button class="btn p" id="lb" type="submit" style="width:100%">Sign in</button></p>
    <p style="margin:14px 0 0;text-align:center"><a href="./" style="color:var(--mute);font-size:13px">Back to the website</a></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <a class="brand" href="./"><img class="lg-e" src="assets/logo-emblem.png" alt="" width="40" height="40"><img class="lg-w" src="assets/logo-wordmark.png" alt="Care Scan &amp; Diagnostic Centre" height="30"></a>
    <h1>Staff dashboard</h1>
    <div class="sp"><button class="btn sm" id="refresh" type="button">Refresh</button><button class="btn sm" id="out" type="button">Sign out</button></div>
  </div></header>
  <main class="wrap">
    <div id="banners"></div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-appts" aria-selected="true" aria-controls="p-appts">Appointments</button>
      <button role="tab" id="t-subs" aria-selected="false" aria-controls="p-subs">Newsletter subscribers</button>
    </div>

    <section id="p-appts" role="tabpanel" aria-labelledby="t-appts">
      <div class="filters">
        <div class="full"><label for="fq">Search name, phone or email</label><input id="fq" type="search" placeholder="e.g. Asha or 98807"></div>
        <div><label for="fs">Status</label><select id="fs"><option value="">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
        <div><label for="ff">From date</label><input id="ff" type="date"></div>
        <div><label for="ft">To date</label><input id="ft" type="date"></div>
        <div><label for="fo">Sort by</label><select id="fo"><option value="newest">Newest requests</option><option value="date">Appointment date</option></select></div>
      </div>
      <div class="quick">
        <button class="btn sm" type="button" data-q="today">Today</button>
        <button class="btn sm" type="button" data-q="upcoming">Upcoming</button>
        <button class="btn sm" type="button" data-q="pending">Needs confirmation</button>
        <button class="btn sm" type="button" data-q="clear">Clear filters</button>
        <span class="meta" id="count"></span>
        <button class="btn sm" id="csv" type="button">Download CSV</button>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Ref</th><th>Appointment</th><th>Patient</th><th>Service</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>

    <section id="p-subs" role="tabpanel" aria-labelledby="t-subs" hidden>
      <div class="quick"><span class="meta" id="scount" style="margin-left:0"></span><button class="btn sm" id="scsv" type="button" style="margin-left:auto">Download CSV</button></div>
      <div class="tw"><table style="min-width:420px"><thead><tr><th>Email</th><th>Subscribed</th></tr></thead><tbody id="srows"></tbody></table></div>
    </section>
  </main>
</div>
<div id="toast" role="status" hidden></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const API=location.protocol==='file:'?'http://127.0.0.1:8000':'';
const KEY='cs_admin_token';
let token=sessionStorage.getItem(KEY)||'',timer=null,loadSeq=0;

function el(tag,props,...kids){const e=document.createElement(tag);if(props)for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}kids.flat().forEach(c=>c!=null&&e.append(c));return e}
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}

function showLogin(msg){token='';sessionStorage.removeItem(KEY);clearInterval(timer);$('#app').hidden=true;$('#login').hidden=false;const e=$('#le');e.hidden=!msg;e.textContent=msg||'';$('#pw').focus()}
function showApp(){$('#login').hidden=true;$('#app').hidden=false;loadAll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)loadAll(true)},60000)}

async function api(path,opts={}){
  let res;
  try{res=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}})}
  catch(_){throw new Error('Could not reach the server. Check that it is running.')}
  if(res.status===401){showLogin('Your session has ended. Please sign in again.');throw new Error('auth')}
  if(!res.ok){let j={};try{j=await res.json()}catch(_){}throw new Error(typeof j.detail==='string'?j.detail:'Request failed ('+res.status+')')}
  return res
}

$('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb'),err=$('#le');b.disabled=true;err.hidden=true;
  try{const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Sign in failed.');
    token=j.token;sessionStorage.setItem(KEY,token);$('#pw').value='';showApp()}
  catch(x){err.hidden=false;err.textContent=x instanceof TypeError?'Could not reach the server. Check that it is running.':x.message}
  finally{b.disabled=false}};
$('#out').onclick=()=>showLogin();
$('#refresh').onclick=()=>loadAll();

/* ---------- formatting ---------- */
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtStamp=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})};
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());

/* ---------- appointments ---------- */
function query(){const p=new URLSearchParams();
  if($('#fq').value.trim())p.set('q',$('#fq').value.trim());
  if($('#fs').value)p.set('status',$('#fs').value);
  if($('#ff').value)p.set('date_from',$('#ff').value);
  if($('#ft').value)p.set('date_to',$('#ft').value);
  return p}
const NEXT={pending:[['confirmed','Confirm','p'],['cancelled','Cancel','']],confirmed:[['completed','Mark done',''],['cancelled','Cancel','']],cancelled:[['pending','Reopen','']],completed:[]};

async function setStatus(id,status){
  try{await api(`/appointments/${id}/status?status=${encodeURIComponent(status)}`,{method:'PATCH'});toast('Appointment #'+id+' marked '+status);loadAll(true)}
  catch(e){if(e.message!=='auth'){toast(e.message,1);loadAll(true)}}}
async function remove(id,name){
  if(!confirm(`Permanently delete appointment #${id} for ${name}? This cannot be undone.\n\n(To free the slot but keep the record, use Cancel instead.)`))return;
  try{await api('/appointments/'+id,{method:'DELETE'});toast('Appointment #'+id+' deleted');loadAll(true)}
  catch(e){if(e.message!=='auth')toast(e.message,1)}}

function row(a){
  const acts=el('div',{class:'acts'},NEXT[a.status].map(([s,l,c])=>el('button',{class:'btn sm '+c,type:'button',text:l,onclick:()=>setStatus(a.appointment_id,s)})),
    el('button',{class:'btn sm danger',type:'button',text:'Delete','aria-label':'Delete appointment '+a.appointment_id,onclick:()=>remove(a.appointment_id,a.patient_name)}));
  return el('tr',{class:a.appointment_date===today()&&a.status!=='cancelled'?'today':''},
    el('td',{text:'#'+a.appointment_id}),
    el('td',{class:'when'},el('b',{text:fmtDate(a.appointment_date)}),el('span',{text:a.time_label}),el('small',{text:a.created_at?'Requested '+fmtStamp(a.created_at):''})),
    el('td',null,el('b',{text:a.patient_name}),el('small',null,el('a',{href:'tel:'+a.phone,text:a.phone})),el('small',null,el('a',{href:'mailto:'+a.email,text:a.email}))),
    el('td',{text:a.service||'—'}),
    el('td',{class:'reason',text:a.reason||'—'}),
    el('td',null,el('span',{class:'badge s-'+a.status,text:a.status[0].toUpperCase()+a.status.slice(1)})),
    el('td',null,acts))}

async function loadAppointments(){
  const seq=++loadSeq,p=query();p.set('order',$('#fo').value);p.set('limit','500');
  const j=await(await api('/appointments?'+p)).json();
  if(seq!==loadSeq)return;
  const body=$('#rows');body.replaceChildren();
  if(!j.items.length)body.append(el('tr',null,el('td',{class:'empty',colspan:'7',text:'No appointments match these filters.'})));
  else j.items.forEach(a=>body.append(row(a)));
  $('#count').textContent=j.total>j.items.length?`Showing ${j.items.length} of ${j.total}`:`${j.total} appointment${j.total===1?'':'s'}`}

async function loadStats(){
  const s=await(await api('/admin/stats')).json();
  const box=$('#stats');box.replaceChildren();
  [['Today',s.today],['Awaiting confirmation',s.pending],['Upcoming confirmed',s.upcoming_confirmed],['All appointments',s.total],['Subscribers',s.subscribers]]
    .forEach(([l,n])=>box.append(el('div',{class:'card stat'},el('b',{text:String(n)}),el('span',{text:l}))));
  const bn=$('#banners');bn.replaceChildren();
  if(s.unfilled_placeholders.length)bn.append(el('div',{class:'banner',text:'The public website still shows placeholder text for: '+s.unfilled_placeholders.join(', ')+'. Fill these in clinic_config.json before launch.'}));
  if(!s.email_enabled)bn.append(el('div',{class:'banner info',text:'E-mail notifications are off. Patients will not get automatic confirmation e-mails until SMTP is set in .env. Check this page regularly for new requests.'}))}

async function loadSubs(){
  const j=await(await api('/admin/subscribers')).json(),b=$('#srows');b.replaceChildren();
  if(!j.items.length)b.append(el('tr',null,el('td',{class:'empty',colspan:'2',text:'No subscribers yet.'})));
  else j.items.forEach(r=>b.append(el('tr',null,el('td',{text:r.email}),el('td',{text:fmtStamp(r.created_at)}))));
  $('#scount').textContent=j.total+' subscriber'+(j.total===1?'':'s')}

async function loadAll(quiet){
  try{await Promise.all([loadStats(),loadAppointments(),loadSubs()])}
  catch(e){if(e.message!=='auth'&&!quiet)toast(e.message,1)}}

/* ---------- filters ---------- */
let deb;['fq'].forEach(i=>$('#'+i).oninput=()=>{clearTimeout(deb);deb=setTimeout(()=>loadAppointments().catch(()=>{}),300)});
['fs','ff','ft','fo'].forEach(i=>$('#'+i).onchange=()=>loadAppointments().catch(()=>{}));
$$('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;
  $('#fq').value='';$('#fs').value='';$('#ff').value='';$('#ft').value='';$('#fo').value='date';
  if(q==='today'){$('#ff').value=$('#ft').value=today()}
  if(q==='upcoming'){$('#ff').value=today()}
  if(q==='pending'){$('#fs').value='pending'}
  if(q==='clear'){$('#fo').value='newest'}
  loadAppointments().catch(()=>{})});

/* ---------- CSV ---------- */
async function download(path,name){
  try{const blob=await(await api(path)).blob(),a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  catch(e){if(e.message!=='auth')toast(e.message,1)}}
$('#csv').onclick=()=>download('/admin/appointments.csv?'+query(),'appointments.csv');
$('#scsv').onclick=()=>download('/admin/subscribers.csv','subscribers.csv');

/* ---------- tabs ---------- */
function tab(which){const a=which==='appts';$('#t-appts').setAttribute('aria-selected',a);$('#t-subs').setAttribute('aria-selected',!a);$('#p-appts').hidden=!a;$('#p-subs').hidden=a}
$('#t-appts').onclick=()=>tab('appts');$('#t-subs').onclick=()=>tab('subs');

token?showApp():showLogin();
</script>
</body></html>
